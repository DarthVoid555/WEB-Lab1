<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="dist/css/main.css">
</head>
<body>

  <header class="header">
    <div class="container header__inner">
      <h1 class="header__title">To-Do List</h1>
      
      <!-- Переключатель темы -->
      <button type="button" class="theme-toggle js-theme-toggle" aria-label="Переключить тему">
        <span class="theme-toggle__icon" aria-hidden="true">🌙</span>
      </button>
    </div>
  </header>

  <main class="main container">
    <!-- Поиск -->
    <div class="search">
      <label for="search-input" class="visually-hidden">Поиск задач</label>
      <input type="search" id="search-input" class="search__input js-search" placeholder="Поиск задач...">
    </div>

    <div class="tasks-header">
      <h2 class="visually-hidden">Список задач</h2>
      <button type="button" class="btn btn--primary js-add-btn">Добавить задачу</button>
    </div>

    <!-- Список задач -->
    <ul class="task-list js-task-list" id="task-list"></ul>
    <p class="empty-state js-empty-state">Пока нет задач.</p>
  </main>

  <!-- Модальное окно добавления/редактирования -->
  <dialog class="modal js-modal" aria-labelledby="modal-title">
    <form class="modal__form js-form" method="dialog">
      <h2 id="modal-title" class="modal__title">Новая задача</h2>
      
      <div class="form-group">
        <label for="task-title" class="form-group__label">Название задачи</label>
        <input type="text" id="task-title" class="form-group__input js-task-input" name="title" required autocomplete="off">
      </div>

      <div class="modal__actions">
        <button type="button" class="btn btn--secondary js-close-btn">Отмена</button>
        <button type="submit" class="btn btn--primary">Сохранить</button>
      </div>
    </form>
  </dialog>

  <script src="js/main.js"></script>
</body>
</html>
