<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List (Tailwind)</title>
  <link rel="stylesheet" href="dist/css/main.css">
</head>
<body class="bg-zinc-50 text-zinc-900 dark:bg-zinc-950 dark:text-zinc-50 font-sans antialiased min-h-screen transition-colors duration-300">

<header class="border-b border-zinc-200 dark:border-zinc-800 bg-white dark:bg-zinc-900">
  <div class="max-w-3xl mx-auto px-4 py-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold">To-Do List</h1>

    <!-- Кнопка темы -->
    <button type="button" id="theme-btn" class="px-3 py-2 text-sm font-medium whitespace-nowrap flex items-center justify-center rounded-lg text-zinc-500 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:bg-zinc-800 focus-visible:outline-2 focus-visible:outline-blue-500 transition-colors border border-transparent hover:border-zinc-200 dark:hover:border-zinc-700" aria-label="Переключить тему">
      <span id="theme-icon">switch to dark theme</span>
    </button>
  </div>
</header>

<main class="max-w-3xl mx-auto px-4 py-8 flex flex-col gap-6">

  <!-- Поиск -->
  <div>
    <label for="search-input" class="sr-only">Поиск задач</label>
    <input
            type="search"
            id="search-input"
            class="w-full px-4 py-3 rounded-lg border border-zinc-300 bg-white text-zinc-900 placeholder-zinc-400 dark:border-zinc-700 dark:bg-zinc-900 dark:text-zinc-50 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
            placeholder="Поиск задач..."
    >
  </div>

  <div class="flex justify-end">
    <h2 class="sr-only">Список задач</h2>
    <button type="button" id="add-btn" class="px-5 py-2.5 rounded-lg bg-blue-600 text-white font-semibold text-sm hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 transition-colors">
      Добавить задачу
    </button>
  </div>

  <!-- Список задач -->
  <ul id="task-list" class="flex flex-col gap-3 list-none"></ul>
  <p id="empty-state" class="text-center text-zinc-500 dark:text-zinc-400 py-8 hidden">Пока нет задач.</p>
</main>

<!-- Модальное окно -->
<dialog id="modal" class="m-auto p-0 rounded-xl border-none bg-white dark:bg-zinc-900 text-zinc-900 dark:text-zinc-50 shadow-2xl max-w-sm w-[90%] backdrop:bg-black/50 backdrop:backdrop-blur-sm" aria-labelledby="modal-title">
  <form id="task-form" class="p-6">
    <h2 id="modal-title" class="text-xl font-bold mb-5">Новая задача</h2>

    <div class="flex flex-col gap-2">
      <label for="task-title" class="text-sm font-medium">Название задачи</label>
      <input
              type="text"
              id="task-title"
              class="w-full px-3 py-2.5 rounded-lg border border-zinc-300 bg-zinc-50 text-zinc-900 dark:border-zinc-700 dark:bg-zinc-950 dark:text-zinc-50 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition-colors"
              name="title"
              required
              autocomplete="off"
      >
    </div>

    <div class="flex justify-end gap-3 mt-6">
      <button type="button" id="close-btn" class="px-4 py-2 rounded-lg border border-zinc-300 text-zinc-600 hover:border-zinc-400 dark:border-zinc-700 dark:text-zinc-400 dark:hover:border-zinc-500 focus-visible:outline-2 focus-visible:outline-blue-500 transition-colors">
        Отмена
      </button>
      <button type="submit" class="px-4 py-2 rounded-lg bg-blue-600 text-white font-semibold hover:bg-blue-700 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-blue-500 transition-colors">
        Сохранить
      </button>
    </div>
  </form>
</dialog>

<script src="js/main.js"></script>
</body>
</html>
